# Local development with Docker Desktop. Not used in production.
#
#   docker compose up -d db                # Postgres
#   docker compose run --rm migrate        # apply Prisma migrations
#   docker compose up --build app          # app on http://localhost:9028
#
# The credentials below are for this local container only.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trivo
      POSTGRES_PASSWORD: trivo
      POSTGRES_DB: trivo
    # Only needed to reach the database from your machine (Prisma Studio, psql, npm run dev).
    # The app and the migrate service use the internal network (db:5432), not this port.
    # Port busy or reserved on Windows? Change it: DB_PORT=5434 docker compose up -d db
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trivo -d trivo"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgresql://trivo:trivo@db:5432/trivo
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]

  app:
    build: .
    ports:
      - "9028:9028"
    environment:
      COBROS_STORE: postgres
      DATABASE_URL: postgresql://trivo:trivo@db:5432/trivo
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:

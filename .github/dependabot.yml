version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # One PR for the routine bumps instead of one per package.
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    # Major jumps of the toolchain are upgraded on purpose, not by a bot.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: prisma
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Production stays on the Node LTS line (even versions only).
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(docker)"
